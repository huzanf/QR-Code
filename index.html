<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Custom QR Code Maker</title>
<link rel="stylesheet" href="/app.css">
<script src="https://cdn.jsdelivr.net/npm/qr-code-styling@1.6.0-rc.1/lib/qr-code-styling.js"></script>
<script src="/common.js"></script>
</head>
<body>
<main>
  <h1>Custom QR Code Maker</h1>
  <nav><a href="/stats">My QR codes &amp; stats</a></nav>

  <div class="grid">
    <section class="card" style="margin-top:0">
      <label for="mode">Link type</label>
      <select id="mode">
        <option value="tracked">Tracked (short link, scan stats, editable destination)</option>
        <option value="direct">Direct (QR contains the URL; no stats, can't be changed)</option>
      </select>

      <div id="directBox" hidden>
        <label for="url">URL</label>
        <input id="url" type="url" placeholder="https://example.com">
      </div>

      <div id="trackedBox">
        <label for="pw">Admin password</label>
        <input id="pw" type="password" autocomplete="current-password" placeholder="Your STATS_TOKEN password">
        <div class="hint">Needed to create tracked codes. Kept only until you close this tab.</div>

        <label for="dest">Destination URL</label>
        <input id="dest" type="url" placeholder="https://www.example.com/page">

        <div class="row">
          <div>
            <label for="host">Short link domain</label>
            <select id="host"></select>
          </div>
          <div>
            <label for="slug">Custom back-half <span class="hint">(optional)</span></label>
            <input id="slug" type="text" placeholder="auto" maxlength="60">
          </div>
        </div>
        <div class="hint">Manage domains on the <a href="/stats">My QR codes</a> page.</div>

        <label for="title">Title <span class="hint">(optional, for your reference)</span></label>
        <input id="title" type="text" maxlength="120" placeholder="e.g. XYZ Indoor Mania poster">
      </div>

      <label for="logo">Your custom design (logo shown in the center)</label>
      <input id="logo" type="file" accept="image/*">
      <div class="hint">PNG, JPG, or SVG. <a href="#" id="clearLogo">Remove</a></div>

      <label for="logoSize">Logo size</label>
      <input id="logoSize" type="range" min="0.15" max="0.45" step="0.01" value="0.35">

      <div class="row">
        <div><label for="fg">Dot color</label><input id="fg" type="color" value="#1c1e21"></div>
        <div><label for="bg">Background</label><input id="bg" type="color" value="#ffffff"></div>
      </div>
      <div class="row">
        <div>
          <label for="dots">Dot style</label>
          <select id="dots">
            <option value="square">Square</option>
            <option value="dots" selected>Round dots</option>
            <option value="rounded">Rounded</option>
            <option value="classy">Classy</option>
            <option value="classy-rounded">Classy rounded</option>
            <option value="extra-rounded">Extra rounded</option>
          </select>
        </div>
        <div>
          <label for="corners">Corner style</label>
          <select id="corners">
            <option value="square">Square</option>
            <option value="extra-rounded" selected>Rounded</option>
            <option value="dot">Dot</option>
          </select>
        </div>
      </div>
    </section>

    <section>
      <div class="card" style="margin-top:0; text-align:center">
        <div id="qr" style="display:flex; justify-content:center"></div>
        <div id="shortPreview" class="dest" style="margin:8px 0"></div>
        <div id="err" class="err"></div>
        <div class="btns" style="justify-content:center">
          <button id="create">Create tracked QR code</button>
          <button id="png" class="secondary">Download PNG</button>
          <button id="svg" class="secondary">Download SVG</button>
        </div>
      </div>

      <div id="done" class="card" hidden>
        <h2>QR code created</h2>
        <label>Short link</label>
        <div class="copyrow"><input id="outShort" readonly><button class="secondary" data-copy="outShort">Copy</button></div>
        <label>Your dashboard</label>
        <div class="copyrow"><input id="outDash" readonly><button class="secondary" data-copy="outDash">Copy</button></div>
        <label>Share link <span class="hint">(read-only stats, no password)</span></label>
        <div class="copyrow"><input id="outShare" readonly><button class="secondary" data-copy="outShare">Copy</button></div>
        <div class="btns"><a id="openDash" class="btn" href="#">Open dashboard</a><button id="another" class="secondary">Make another</button></div>
      </div>
    </section>
  </div>
</main>

<script>
let logoData = "";
let previewSlug = "";
let created = false;
const qr = makeQR($("qr"));

function randomSlug() {
  const a = "abcdefghjkmnpqrstuvwxyz23456789";
  return Array.from(crypto.getRandomValues(new Uint8Array(7)), b => a[b % a.length]).join("");
}
function design() {
  return { fg: $("fg").value, bg: $("bg").value, dots: $("dots").value, corners: $("corners").value, logoSize: parseFloat($("logoSize").value), logo: logoData };
}
const tracked = () => $("mode").value === "tracked";

function refresh() {
  $("directBox").hidden = tracked();
  $("trackedBox").hidden = !tracked();
  $("create").hidden = !tracked() || created;
  $("png").hidden = $("svg").hidden = tracked() && !created;
  if (created) return;
  let data = "", error = "";
  if (tracked()) {
    const host = $("host").value;
    const slug = $("slug").value.trim() || previewSlug;
    data = host ? `https://${host}/${slug}` : "";
    $("shortPreview").textContent = data;
    const dest = $("dest").value.trim();
    if (dest && !isValidUrl(dest)) error = "Destination must start with http:// or https://";
    $("create").disabled = !(host && dest && !error);
  } else {
    const url = $("url").value.trim();
    $("shortPreview").textContent = "";
    if (isValidUrl(url)) data = url; else if (url) error = "Enter a full URL starting with http:// or https://";
    $("png").disabled = $("svg").disabled = !data;
  }
  $("err").textContent = error;
  if (data) qr.update(data, design());
}

async function loadDomains() {
  const pw = $("pw").value;
  if (!pw) return;
  Auth.set(pw);
  try {
    const d = await api("/api/domains");
    $("host").innerHTML = [d.primary, ...d.domains].map(h => `<option value="${esc(h)}">${esc(h)}</option>`).join("");
    $("err").textContent = "";
  } catch (e) {
    $("host").innerHTML = "";
    $("err").textContent = e.message;
  }
  refresh();
}

$("logo").addEventListener("change", e => {
  const f = e.target.files[0];
  if (!f) return;
  const r = new FileReader();
  r.onload = async () => { logoData = await scaleLogo(r.result); refresh(); };
  r.readAsDataURL(f);
});
$("clearLogo").addEventListener("click", e => { e.preventDefault(); logoData = ""; $("logo").value = ""; refresh(); });
["mode", "url", "dest", "host", "slug", "fg", "bg", "dots", "corners", "logoSize"].forEach(id => $(id).addEventListener("input", refresh));
$("pw").addEventListener("change", loadDomains);

$("create").onclick = async () => {
  $("create").disabled = true;
  $("err").textContent = "";
  try {
    const r = await api("/api/links", { method: "POST", body: {
      dest: $("dest").value.trim(), host: $("host").value, slug: $("slug").value.trim(), title: $("title").value.trim(), design: design() } });
    created = true;
    qr.update(r.shortUrl, design());
    $("shortPreview").textContent = r.shortUrl;
    $("outShort").value = r.shortUrl; $("outDash").value = r.dashboardUrl; $("outShare").value = r.shareUrl;
    $("openDash").href = r.dashboardUrl;
    $("done").hidden = false;
  } catch (e) {
    $("err").textContent = e.message;
    $("create").disabled = false;
  }
  refresh();
};
$("another").onclick = () => {
  created = false; previewSlug = randomSlug(); $("done").hidden = true; $("slug").value = ""; $("dest").value = ""; $("title").value = ""; refresh();
};
document.querySelectorAll("[data-copy]").forEach(b => b.onclick = () => copyText($(b.dataset.copy).value, b));
$("png").onclick = () => qr.download("png");
$("svg").onclick = () => qr.download("svg");

previewSlug = randomSlug();
$("pw").value = Auth.get();
if ($("pw").value) loadDomains(); else refresh();
</script>
</body>
</html>
