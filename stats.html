<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>My QR Codes</title>
<link rel="stylesheet" href="/app.css">
<script src="/common.js"></script>
</head>
<body>
<main>
  <h1>My QR codes</h1>
  <nav><a href="/">+ Create new QR code</a></nav>

  <form id="login" class="card">
    <label for="pw"><b>Admin password</b></label>
    <input id="pw" type="password" autocomplete="current-password" required style="max-width:320px">
    <button type="submit" style="margin-top:8px">Sign in</button>
    <div id="msg" class="err"></div>
  </form>

  <div id="app" hidden>
    <section class="card">
      <div id="list"></div>
      <div class="btns" style="margin-top:12px"><button id="import" class="secondary" hidden>Import codes from links.json</button><span id="importMsg" class="ok"></span></div>
    </section>

    <section class="card">
      <h2>Short link domains</h2>
      <p class="hint" style="margin-top:0">Each code can use a different domain, such as <code>go.clientsite.com</code>. To use a domain: (1) add it to the Vercel project under <b>Settings → Domains</b>, (2) add the DNS record Vercel shows (usually a <code>CNAME</code> to <code>cname.vercel-dns.com</code>), (3) add it here.</p>
      <div id="domains"></div>
      <div class="copyrow" style="margin-top:10px"><input id="newDomain" type="text" placeholder="go.example.com"><button id="addDomain">Add domain</button></div>
      <div id="domErr" class="err"></div>
    </section>
  </div>
</main>

<script>
function fmtDate(s) { return s ? new Date(s).toLocaleDateString() : "–"; }

async function loadAll() {
  $("msg").textContent = "";
  try {
    const [l, d] = await Promise.all([api("/api/links"), api("/api/domains")]);
    $("login").hidden = true; $("app").hidden = false;
    renderLinks(l); renderDomains(d);
    $("import").hidden = false;
  } catch (e) {
    $("app").hidden = true; $("login").hidden = false;
    if (Auth.get()) $("msg").textContent = e.message;
    Auth.clear();
  }
}

function renderLinks({ links }) {
  if (!links.length) { $("list").innerHTML = '<p class="empty">No tracked QR codes yet. <a href="/">Create your first one</a>.</p>'; return; }
  $("list").innerHTML = `<table><thead><tr><th>Code</th><th>Destination</th><th>Scans</th><th>Last scan</th><th></th></tr></thead><tbody>` +
    links.map(l => `<tr>
      <td><b>${esc(l.title || l.slug)}</b><br><a href="${esc(l.shortUrl)}" target="_blank" rel="noopener">${esc(l.shortUrl.replace(/^https?:\/\//, ""))}</a></td>
      <td class="dest">${esc(l.dest)}</td><td>${l.total}</td><td>${esc(fmtDate(l.last))}</td>
      <td><a class="btn secondary" href="/dashboard?l=${encodeURIComponent(l.id)}">Dashboard</a></td></tr>`).join("") + `</tbody></table>`;
}

function renderDomains({ primary, domains }) {
  $("domains").innerHTML = `<div class="brow" style="--pct:0%"><span>${esc(primary)}</span><span class="hint">main address</span></div>` +
    domains.map(h => `<div class="brow" style="--pct:0%"><span>${esc(h)}</span><button class="danger" data-rm="${esc(h)}" style="padding:2px 8px">Remove</button></div>`).join("");
  document.querySelectorAll("[data-rm]").forEach(b => b.onclick = async () => {
    if (!confirm(`Remove ${b.dataset.rm} from the list? Existing short links on it keep working.`)) return;
    try { renderDomains(await api("/api/domains?host=" + encodeURIComponent(b.dataset.rm), { method: "DELETE" })); } catch (e) { $("domErr").textContent = e.message; }
  });
}

$("login").addEventListener("submit", e => { e.preventDefault(); Auth.set($("pw").value); loadAll(); });
$("addDomain").onclick = async () => {
  $("domErr").textContent = "";
  try { renderDomains(await api("/api/domains", { method: "POST", body: { host: $("newDomain").value } })); $("newDomain").value = ""; }
  catch (e) { $("domErr").textContent = e.message; }
};
$("import").onclick = async () => {
  try { const r = await api("/api/links", { method: "POST", body: { importLegacy: true } }); $("importMsg").textContent = `${r.imported} imported`; await loadAll(); }
  catch (e) { $("importMsg").textContent = e.message; }
};
if (Auth.get()) loadAll();
</script>
</body>
</html>
